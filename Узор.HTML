<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>?? IT-Викторина | Проверь свои знания</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
            padding: 30px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-header h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .quiz-header p {
            color: #666;
            font-size: 1.1em;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .question-card:hover {
            transform: translateX(5px);
        }

        .question-text {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #e0e0e0;
        }

        .option:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .option input {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .option label {
            cursor: pointer;
            font-size: 1em;
            color: #555;
            flex: 1;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .result-container {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
        }

        .score-display {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
        }

        #restart-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        #restart-btn:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .question-text {
                font-size: 1em;
            }
            
            .option label {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quiz-header">
            <h1>?? IT-Викторина</h1>
            <p>Проверь свои знания! Ответь на 5 вопросов.</p>
        </div>

        <div id="quiz-container">
            <!-- Вопросы будут подставлены сюда из JavaScript -->
        </div>

        <div class="result-container" id="result-container" style="display: none;">
            <h2>?? Ваш результат:</h2>
            <div class="score-display" id="score-display">0 / 0</div>
            <p id="result-message"></p>
            <button id="restart-btn">?? Пройти заново</button>
        </div>

        <button id="submit-btn" class="submit-btn">? Завершить викторину</button>
    </div>

    <script>
        // Вопросы для викторины
        const questions = [
            {
                text: "Что означает аббревиатура HTML?",
                options: [
                    "Home Tool Markup Language",
                    "Hyper Text Markup Language",
                    "Hyperlinks and Text Markup Language",
                    "High Tech Modern Language"
                ],
                correct: 1
            },
            {
                text: "Какой язык используется для стилизации веб-страниц?",
                options: [
                    "HTML",
                    "JavaScript",
                    "CSS",
                    "Python"
                ],
                correct: 2
            },
            {
                text: "Что такое Git?",
                options: [
                    "Язык программирования",
                    "Система контроля версий",
                    "База данных",
                    "Веб-сервер"
                ],
                correct: 1
            },
            {
                text: "Какой символ используется для комментариев в JavaScript?",
                options: [
                    "<!-- -->",
                    "/* */",
                    "#",
                    "//"
                ],
                correct: 3
            },
            {
                text: "Что делает GitHub Pages?",
                options: [
                    "Хранит базы данных",
                    "Хостит статические сайты",
                    "Запускает серверные скрипты",
                    "Работает с Docker"
                ],
                correct: 1
            }
        ];

        let userAnswers = new Array(questions.length).fill(null);

        // Функция отображения вопросов
        function renderQuestions() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            questions.forEach((question, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-card';
                
                const questionText = document.createElement('div');
                questionText.className = 'question-text';
                questionText.textContent = `${index + 1}. ${question.text}`;
                questionDiv.appendChild(questionText);
                
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                
                question.options.forEach((option, optIndex) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';
                    
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `question${index}`;
                    radio.value = optIndex;
                    radio.id = `q${index}_opt${optIndex}`;
                    
                    if (userAnswers[index] === optIndex) {
                        radio.checked = true;
                    }
                    
                    radio.addEventListener('change', (e) => {
                        userAnswers[index] = parseInt(e.target.value);
                        saveAnswersToLocal();
                    });
                    
                    const label = document.createElement('label');
                    label.htmlFor = `q${index}_opt${optIndex}`;
                    label.textContent = `${String.fromCharCode(65 + optIndex)}. ${option}`;
                    
                    optionDiv.appendChild(radio);
                    optionDiv.appendChild(label);
                    optionsDiv.appendChild(optionDiv);
                });
                
                questionDiv.appendChild(optionsDiv);
                container.appendChild(questionDiv);
            });
        }

        // Сохраняем ответы в localStorage
        function saveAnswersToLocal() {
            localStorage.setItem('quizAnswers', JSON.stringify(userAnswers));
        }

        // Загружаем сохранённые ответы
        function loadAnswersFromLocal() {
            const saved = localStorage.getItem('quizAnswers');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed.length === questions.length) {
                    userAnswers = parsed;
                }
            }
        }

        // Подсчёт результатов
        function calculateScore() {
            let score = 0;
            questions.forEach((question, index) => {
                if (userAnswers[index] !== null && userAnswers[index] === question.correct) {
                    score++;
                }
            });
            return score;
        }

        // Показать результат
        function showResults() {
            const score = calculateScore();
            const total = questions.length;
            const percentage = (score / total) * 100;
            
            const resultContainer = document.getElementById('result-container');
            const scoreDisplay = document.getElementById('score-display');
            const resultMessage = document.getElementById('result-message');
            const submitBtn = document.getElementById('submit-btn');
            const quizContainer = document.getElementById('quiz-container');
            
            quizContainer.style.display = 'none';
            submitBtn.style.display = 'none';
            
            scoreDisplay.textContent = `${score} / ${total}`;
            
            if (percentage === 100) {
                resultMessage.innerHTML = "?? Идеально! Вы настоящий IT-гуру! ??";
            } else if (percentage >= 80) {
                resultMessage.innerHTML = "?? Отлично! Вы очень хорошо разбираетесь! ??";
            } else if (percentage >= 60) {
                resultMessage.innerHTML = "?? Хорошо! Но есть куда расти. Попробуйте ещё раз!";
            } else if (percentage >= 40) {
                resultMessage.innerHTML = "?? Неплохо для начала! Почитайте ещё документацию.";
            } else {
                resultMessage.innerHTML = "?? Не сдавайтесь! Посмотрите правильные ответы и попробуйте заново.";
            }
            
            resultContainer.style.display = 'block';
            localStorage.removeItem('quizAnswers');
        }

        // Перезапуск викторины
        function restartQuiz() {
            userAnswers = new Array(questions.length).fill(null);
            localStorage.removeItem('quizAnswers');
            
            const resultContainer = document.getElementById('result-container');
            const quizContainer = document.getElementById('quiz-container');
            const submitBtn = document.getElementById('submit-btn');
            
            resultContainer.style.display = 'none';
            quizContainer.style.display = 'block';
            submitBtn.style.display = 'block';
            
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Проверка, все ли вопросы отвечены
        function checkAllAnswered() {
            const allAnswered = userAnswers.every(answer => answer !== null);
            if (!allAnswered) {
                return confirm("Вы ответили не на все вопросы. Всё равно завершить?");
            }
            return true;
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            loadAnswersFromLocal();
            renderQuestions();
            
            const submitBtn = document.getElementById('submit-btn');
            const restartBtn = document.getElementById('restart-btn');
            
            submitBtn.addEventListener('click', () => {
                if (checkAllAnswered()) {
                    showResults();
                }
            });
            
            if (restartBtn) {
                restartBtn.addEventListener('click', restartQuiz);
            }
        });
    </script>
</body>
</html>
