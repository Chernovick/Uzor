<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Викторина про якутские праздники</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; }
  h1 { text-align: center; }
  .question { margin-top: 20px; font-weight: bold; }
  .answers { margin-top: 10px; }
  button { display: block; margin-top: 10px; padding: 10px 20px; font-size: 16px; }
  #result { margin-top: 30px; font-size: 18px; font-weight: bold; text-align: center; }
</style>
</head>
<body>

<h1>Викторина по якутским праздникам и культуре</h1>

<div id="quiz-container">
  <div class="question" id="question"></div>
  <div class="answers" id="answers"></div>
  <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Следующий вопрос</button>
</div>

<div id="result"></div>

<script>
// Список вопросов
const questions = [
  {
    question: "Как называется главный летний праздник якутов с хороводом осуохай?",
    options: ["Ысыах", "Варна", "Сагаалган"],
    correct: 0
  },
  {
    question: "Кто является главным героем эпоса «Олонхо»?",
    options: ["Кудай Бахсы", "Нюргун Боотур", "Абаасы"],
    correct: 1
  },
  {
    question: "Как переводится с якутского слово «Күн»?",
    options: ["Луна", "Солнце", "Звезда"],
    correct: 1
  },
  {
    question: "Какой музыкальный инструмент – символ Якутии?",
    options: ["Хомус", "Чангы", "Балалайка"],
    correct: 0
  },
  {
    question: "Кто основал Ленский острог (город Якутск) в 1632 году?",
    options: ["Ермак", "Пётр Бекетов", "Дежнёв"],
    correct: 1
  }
];

let currentQuestion = 0;  // индекс текущего вопроса
let score = 0;            // счет правильных ответов

const questionEl = document.getElementById('question');
const answersEl = document.getElementById('answers');
const nextBtn = document.getElementById('nextBtn');
const resultEl = document.getElementById('result');

// Загружает текущий вопрос
function loadQuestion() {
  const q = questions[currentQuestion];
  questionEl.textContent = q.question;
  answersEl.innerHTML = '';

  // Создаем кнопки для вариантов
  q.options.forEach((option, index) => {
    const btn = document.createElement('button');
    btn.textContent = option;
    btn.onclick = () => selectAnswer(index);
    answersEl.appendChild(btn);
  });

  // скрываем кнопку "следующий вопрос"
  nextBtn.style.display = 'none';
}

// Обрабатывает выбор ответа
function selectAnswer(index) {
  const correctIndex = questions[currentQuestion].correct;
  if (index === correctIndex) {
    score++; // увеличиваем счет, если ответ правильный
  }

  // выделяем правильный и выбранный ответ
  Array.from(answersEl.children).forEach((btn, i) => {
    btn.disabled = true; // блокируем повторный выбор
    if (i === correctIndex) {
      btn.style.backgroundColor = 'lightgreen'; // правильный ответ
    } else if (i === index) {
      btn.style.backgroundColor = 'salmon'; // выбранный неправильный
    }
  });

  // показываем кнопку "следующий вопрос"
  nextBtn.style.display = 'inline';
}

// Переходит к следующему вопросу или показывает результат
function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= questions.length) {
    showResult();
  } else {
    loadQuestion();
  }
}

// Показывает итог
function showResult() {
  document.getElementById('quiz-container').style.display = 'none';
  resultEl.innerHTML = `Отлично! Вы набрали ${score} из ${questions.length} правильных ответов.`;
}

// запускаем первый вопрос
loadQuestion();
</script>

</body>
</html>
